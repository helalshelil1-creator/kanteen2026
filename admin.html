<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#02060f">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كانتِين - الإدارة">
<title>لوحة التحكم | كانتِين Kanteen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-helpers.js"></script>
<script src="kt-sound.js"></script>
<style>
:root,[data-theme="dark"]{--brand:#ff6b35;--brand-2:#ff8a5b;--gold:#ffb800;--gold-2:#ffd9a0;--fresh:#22c55e;--fresh-2:#4ade80;--danger:#ef4444;--info:#3b82f6;--purple:#a78bfa;--bg:#02060f;--bg-2:#070d1b;--bg-3:#0d1524;--ink:#fff;--ink-2:#c4d0dd;--ink-3:#8a95a3;--ink-4:#5a6472;--line:rgba(196,214,232,.12);--line-2:rgba(196,214,232,.22);--glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--r-lg:20px;--r-xl:26px;--r-pill:999px;--sh-2:0 12px 36px rgba(0,0,0,.5);--ease:cubic-bezier(.25,.8,.35,1);--ease-out:cubic-bezier(.16,1,.3,1);--sidebar-w:300px}
[data-theme="light"]{--brand:#ff6b35;--brand-2:#ff8a5b;--gold:#f59e0b;--gold-2:#fbbf24;--fresh:#16a34a;--fresh-2:#22c55e;--bg:#f7f8fb;--bg-2:#eef2f8;--bg-3:#e0e6ef;--ink:#0a0f1e;--ink-2:#2a3448;--ink-3:#4a5568;--ink-4:#6b7488;--line:rgba(15,23,41,.1);--line-2:rgba(15,23,41,.16);--glass:rgba(255,255,255,.75);--glass-2:rgba(255,255,255,.95)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Readex Pro','Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit;outline:none;font-family:inherit}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--brand)}
.k-bg-image{position:fixed;inset:0;background-image:url('mandoop.jpg');background-size:cover;background-position:left center;background-repeat:no-repeat;z-index:-2;pointer-events:none;filter:brightness(.85) saturate(1.1)}
@media(max-width:900px){.k-bg-image{background-attachment:scroll;background-size:cover;background-position:35% center}}
.k-bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(140% 60% at 50% 40%,rgba(2,6,15,.55) 0%,rgba(2,6,15,.35) 50%,transparent 100%),linear-gradient(180deg,rgba(2,6,15,.7) 0%,rgba(2,6,15,.92) 100%)}
[data-theme="light"] .k-bg-overlay{background:radial-gradient(140% 60% at 50% 40%,rgba(247,248,251,.75) 0%,rgba(247,248,251,.45) 50%,transparent 100%),linear-gradient(180deg,rgba(247,248,251,.7) 0%,rgba(247,248,251,.95) 100%)}
@keyframes ktFadeSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes ktFadeIn{from{opacity:0}to{opacity:1}}
@keyframes ktScaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes ktSlideIn{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}
@keyframes ktBadgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.kt-anim-1{animation:ktFadeSlideUp .5s var(--ease-out) .05s both}
.kt-anim-2{animation:ktFadeSlideUp .5s var(--ease-out) .15s both}
.kt-anim-3{animation:ktFadeSlideUp .5s var(--ease-out) .25s both}
.kt-anim-4{animation:ktFadeSlideUp .5s var(--ease-out) .35s both}
.k-stat{animation:ktScaleIn .4s var(--ease-out) both}
.k-login-screen{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}
.k-login-card{width:100%;max-width:480px;background:rgba(7,13,27,.85);backdrop-filter:blur(50px) saturate(180%);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:44px 36px;box-shadow:0 40px 100px rgba(0,0,0,.7);text-align:center;position:relative;animation:ktScaleIn .5s var(--ease-out)}
[data-theme="light"] .k-login-card{background:rgba(255,255,255,.94)}
.k-login-logo{height:92px;width:auto;margin:0 auto 20px;display:block}
.k-login-card h1{font-family:'Reem Kufi',serif;font-size:34px;font-weight:900;margin-bottom:8px}
.k-login-card h1 .blue{background:linear-gradient(180deg,#60A5FA,#2563EB);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.k-login-card h1 .gold{background:linear-gradient(180deg,#FBBF24,#EA580C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.k-login-card>p{font-size:14.5px;color:var(--ink-3);margin-bottom:32px}
.k-login-field{margin-bottom:18px;text-align:start}
.k-login-field label{display:block;font-size:14px;font-weight:600;margin-bottom:10px;color:var(--ink-2)}
.k-login-field input{width:100%;padding:16px 18px;border-radius:14px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--ink);font-size:16px;transition:all .2s}
.k-login-field input:focus{border-color:var(--brand);box-shadow:0 0 0 5px rgba(255,107,53,.18)}
.k-login-btn{width:100%;padding:17px;border-radius:var(--r-pill);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:16px;font-weight:800;box-shadow:0 12px 30px rgba(255,107,53,.5);transition:all .25s;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:none}
.k-login-btn:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(255,107,53,.7)}
.k-login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.k-login-btn svg{width:20px;height:20px}
.k-login-err{display:none;margin-top:16px;padding:14px;border-radius:12px;background:rgba(239,68,68,.15);color:#f87171;font-size:14px;font-weight:600;text-align:center;border:1px solid rgba(239,68,68,.3)}
.k-shell{display:none;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.k-shell.active{display:grid}
.k-sidebar{background:rgba(7,13,27,.8);backdrop-filter:blur(40px) saturate(180%);border-inline-end:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
[data-theme="light"] .k-sidebar{background:rgba(255,255,255,.88)}
.k-brand{display:flex;align-items:center;gap:14px;padding:0 10px 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.k-brand img{height:56px;width:auto}
.k-brand-text{display:flex;flex-direction:column;line-height:1.1}
.k-brand-text b{font-size:16px;font-weight:800;font-family:'Reem Kufi',serif}
.k-brand-text span{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
.k-nav{display:flex;flex-direction:column;gap:4px}
.k-nav-sep{padding:18px 14px 8px;font-size:11px;color:var(--ink-4);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.k-nav-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;color:var(--ink-2);font-weight:600;font-size:14.5px;transition:all .2s;width:100%;text-align:start;position:relative;border:none;cursor:pointer;background:none}
.k-nav-item:hover{background:var(--glass);color:var(--ink)}
.k-nav-item.active{background:linear-gradient(135deg,rgba(255,107,53,.2),rgba(255,184,0,.1));color:var(--brand)}
.k-nav-item.active::before{content:'';position:absolute;inset-inline-start:0;top:22%;bottom:22%;width:4px;background:var(--brand);border-radius:0 4px 4px 0}
.k-nav-item svg{width:20px;height:20px;stroke-width:1.9;flex:none}
.k-nav-item .count{margin-inline-start:auto;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:800;background:var(--brand);color:#fff}
.k-nav-item .count.green{background:var(--fresh)}
.k-nav-item .count.warn{background:var(--gold);color:#1a1206}
.k-nav-item .count.danger{background:var(--danger)}
.k-nav-item .count.purple{background:var(--purple);color:#1a1206}
.k-nav-item .count.blue{background:var(--info)}
.k-sidebar-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.k-main{display:flex;flex-direction:column;min-width:0}
.k-topbar{height:78px;padding:0 28px;background:rgba(7,13,27,.8);backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
[data-theme="light"] .k-topbar{background:rgba(255,255,255,.88)}
.k-topbar-title{font-size:19px;font-weight:800;flex:1;display:flex;flex-direction:column;line-height:1.2}
.k-topbar-title small{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:4px}
.k-topbar-actions{display:flex;align-items:center;gap:10px}
.k-icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);background:var(--glass);border:1px solid var(--line-2);transition:all .25s;position:relative;cursor:pointer}
.k-icon-btn:hover{color:var(--gold);background:var(--glass-2);border-color:var(--brand);transform:translateY(-2px)}
.k-icon-btn svg{width:22px;height:22px}
.k-icon-btn .dot{position:absolute;top:-4px;inset-inline-end:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg-2);box-shadow:0 4px 12px rgba(239,68,68,.6);animation:ktBadgePulse 2s infinite}
.k-content{flex:1;padding:28px;overflow-x:hidden}
.k-stats{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:24px}
.k-stat{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden;transition:all .25s;cursor:pointer}
.k-stat:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 42px rgba(0,0,0,.5);border-color:var(--brand)}
.k-stat::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--brand),var(--gold))}
.k-stat.green::after{background:linear-gradient(180deg,var(--fresh),var(--fresh-2))}
.k-stat.blue::after{background:linear-gradient(180deg,var(--info),#93c5fd)}
.k-stat.purple::after{background:linear-gradient(180deg,var(--purple),#c4b5fd)}
.k-stat.warn::after{background:linear-gradient(180deg,var(--gold),#fbbf24)}
.k-stat.danger::after{background:linear-gradient(180deg,var(--danger),#f87171)}
.k-stat-arrow{position:absolute;top:14px;inset-inline-end:14px;opacity:.35;font-size:18px;transition:opacity .25s}
.k-stat:hover .k-stat-arrow{opacity:.9}
.k-stat-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--glass-2);margin-bottom:14px}
.k-stat-icon svg{width:26px;height:26px;color:var(--brand)}
.k-stat.green .k-stat-icon svg{color:var(--fresh)}
.k-stat.blue .k-stat-icon svg{color:var(--info)}
.k-stat.purple .k-stat-icon svg{color:var(--purple)}
.k-stat.warn .k-stat-icon svg{color:var(--gold)}
.k-stat.danger .k-stat-icon svg{color:var(--danger)}
.k-stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;margin-bottom:10px}
.k-stat-value{font-size:32px;font-weight:800;line-height:1}
.k-card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;margin-bottom:22px}
[data-theme="light"] .k-card{background:rgba(255,255,255,.92)}
.k-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px}
.k-card-head h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:12px}
.k-card-head h3 svg{width:22px;height:22px;color:var(--brand)}
.k-table-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg-2)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{padding:14px 16px;text-align:start;background:var(--bg-3);font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);white-space:nowrap}
.k-table td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.k-table tr:last-child td{border-bottom:none}
.k-table tr:hover{background:var(--glass)}
.k-merchant-card{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:flex-start;transition:all .25s}
.k-merchant-card:hover{border-color:var(--brand);transform:translateY(-2px)}
.k-merchant-card.pending{border-color:rgba(255,184,0,.5);background:linear-gradient(135deg,rgba(255,184,0,.06),transparent)}
.k-merchant-card.approved{border-color:rgba(34,197,94,.35)}
.k-merchant-card.suspended{border-color:rgba(239,68,68,.35);background:linear-gradient(135deg,rgba(239,68,68,.06),transparent)}
@media(max-width:768px){.k-merchant-card{grid-template-columns:1fr}}
.k-merchant-avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--gold));display:grid;place-items:center;font-size:30px;flex:none;overflow:hidden}
.k-merchant-avatar img{width:100%;height:100%;object-fit:cover}
.k-merchant-info h4{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.k-merchant-info .meta{font-size:13.5px;color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.k-merchant-info .meta svg{width:15px;height:15px;flex:none}
.k-merchant-info .meta b{color:var(--ink-2)}
.k-merchant-actions{display:flex;flex-direction:column;gap:8px}
@media(max-width:768px){.k-merchant-actions{flex-direction:row;flex-wrap:wrap}}
.k-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border-radius:var(--r-pill);font-size:14px;font-weight:700;transition:all .25s;white-space:nowrap;cursor:pointer;border:1px solid transparent;font-family:inherit}
.k-btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 22px rgba(255,107,53,.4)}
.k-btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(255,107,53,.6)}
.k-btn-gold{background:linear-gradient(135deg,var(--gold),#ffd9a0);color:#1a1206}
.k-btn-gold:hover{transform:translateY(-3px)}
.k-btn-success{background:linear-gradient(135deg,var(--fresh),#4ade80);color:#fff}
.k-btn-success:hover{transform:translateY(-3px)}
.k-btn-glass{background:var(--glass);border-color:var(--line-2);color:var(--ink);backdrop-filter:blur(14px)}
.k-btn-glass:hover{background:var(--glass-2);border-color:var(--brand)}
.k-btn-danger{background:var(--danger);color:#fff}
.k-btn-danger:hover{transform:translateY(-2px)}
.k-btn-sm{padding:9px 16px;font-size:12.5px}
.k-btn svg{width:16px;height:16px}
.k-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700}
.k-pill-fresh{background:rgba(34,197,94,.15);color:var(--fresh);border:1px solid rgba(34,197,94,.3)}
.k-pill-gold{background:rgba(255,184,0,.15);color:var(--gold);border:1px solid rgba(255,184,0,.3)}
.k-pill-info{background:rgba(59,130,246,.15);color:var(--info);border:1px solid rgba(59,130,246,.3)}
.k-pill-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.k-pill-purple{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.3)}
.k-field{margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.k-field label{font-size:14px;font-weight:600;color:var(--ink-2)}
.k-field input,.k-field select,.k-field textarea{padding:14px 16px;border-radius:13px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--ink);font-size:15px;width:100%;font-family:inherit}
.k-field input:focus,.k-field select:focus,.k-field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 5px rgba(255,107,53,.15)}
.k-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.k-modal-bd{position:fixed;inset:0;background:rgba(2,6,15,.92);backdrop-filter:blur(16px);z-index:999;display:none;align-items:center;justify-content:center;padding:22px;animation:ktFadeIn .2s}
.k-modal-bd.open{display:flex}
.k-modal{background:rgba(7,13,27,.92);backdrop-filter:blur(50px) saturate(180%);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:30px;width:100%;max-width:800px;max-height:92vh;overflow-y:auto;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:ktScaleIn .3s var(--ease-out)}
[data-theme="light"] .k-modal{background:rgba(255,255,255,.98)}
.k-modal-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.k-modal-head h3{flex:1;font-size:20px;font-weight:800;display:flex;align-items:center;gap:12px}
.k-modal-head h3 svg{width:24px;height:24px;color:var(--brand)}
.k-modal-close{width:40px;height:40px;border-radius:50%;background:var(--glass);color:var(--ink-3);display:grid;place-items:center;cursor:pointer;border:none;flex:none}
.k-modal-close:hover{background:var(--glass-2);color:var(--ink)}
.k-toast{position:fixed;bottom:28px;inset-inline-end:28px;padding:16px 24px;background:rgba(2,6,15,.96);backdrop-filter:blur(20px);border:1px solid var(--line-2);border-radius:16px;color:#fff;font-weight:600;font-size:14.5px;z-index:9999;display:flex;align-items:center;gap:12px;animation:ktSlideIn .4s var(--ease-out);box-shadow:0 20px 50px rgba(0,0,0,.5);max-width:calc(100vw - 56px)}
[data-theme="light"] .k-toast{background:#fff;color:var(--ink)}
.k-toast::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
.k-toast.success::before{background:var(--fresh)}
.k-toast.error::before{background:var(--danger)}
.k-empty{text-align:center;padding:60px 24px;color:var(--ink-3)}
.k-empty svg{width:64px;height:64px;margin:0 auto 18px;opacity:.4}
.k-empty h3{font-size:19px;color:var(--ink);margin-bottom:10px;font-weight:700}
.k-empty p{font-size:14px}
.k-fb-status{position:fixed;bottom:10px;inset-inline-end:10px;z-index:9999;padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:800;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#4ade80;font-family:'Courier New',monospace;backdrop-filter:blur(10px);opacity:0;transition:opacity .3s;pointer-events:none}
.k-fb-status.show{opacity:1}
.k-fb-status.err{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#f87171}
.kt-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:10000;display:none;align-items:center;justify-content:center;padding:22px;cursor:zoom-out;animation:ktFadeIn .2s}
.kt-lightbox.open{display:flex}
.kt-lightbox img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.9)}
.kt-lightbox .close{position:absolute;top:18px;inset-inline-end:18px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:20px;backdrop-filter:blur(10px);border:none;font-family:inherit}
.k-burger{display:none}
@media(max-width:900px){
  .k-shell.active{grid-template-columns:1fr}
  .k-sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;z-index:100;width:280px;transform:translateX(-100%);transition:transform .35s var(--ease)}
  [dir="rtl"] .k-sidebar{transform:translateX(100%)}
  .k-sidebar.open{transform:none !important;box-shadow:24px 0 70px rgba(0,0,0,.7)}
  .k-burger{display:grid}
  .k-content{padding:20px 16px}
  .k-stats{grid-template-columns:repeat(2,1fr);gap:14px}
  .k-topbar{padding:0 16px;height:70px}
  .k-topbar-title{font-size:16px}
}
@media(max-width:520px){
  .k-stats{grid-template-columns:1fr}
  .k-modal{padding:22px 18px;border-radius:18px}
  .k-card{padding:18px}
  .k-login-card{padding:32px 22px}
  .k-stat-value{font-size:26px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="k-bg-image"></div>
<div class="k-bg-overlay"></div>

<!-- LOGIN -->
<div class="k-login-screen" id="loginScreen">
  <div class="k-login-card">
    <img src="logo.png" alt="كانتِين" class="k-login-logo" onerror="this.style.display='none'">
    <h1><span class="gold">لوحة</span> <span class="blue">التحكم</span></h1>
    <p>سجّل دخولك للوصول إلى لوحة التحكم</p>
    <div class="k-login-field"><label>✉️ البريد الإلكتروني</label><input type="email" id="inpEmail" placeholder="admin@kanteen.app" autocomplete="email"></div>
    <div class="k-login-field"><label>🔑 كلمة المرور</label><input type="password" id="inpPass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="k-login-btn" id="loginBtn" onclick="doLogin()"><svg data-lucide="log-in"></svg> دخول</button>
    <div class="k-login-err" id="errBox"></div>
  </div>
</div>

<!-- SHELL -->
<div class="k-shell" id="appShell">
  <aside class="k-sidebar" id="sidebar">
    <div class="k-brand">
      <img src="logo.png" alt="كانتِين" onerror="this.style.display='none'">
      <div class="k-brand-text"><b>كانتِين</b><span>ADMIN PANEL v11</span></div>
    </div>
    <nav class="k-nav">
      <div class="k-nav-sep">الرئيسية</div>
      <button class="k-nav-item active" data-tab="dashboard"><i data-lucide="layout-dashboard"></i> لوحة القيادة</button>
      <button class="k-nav-item" data-tab="notifications"><i data-lucide="bell"></i> الإشعارات <span class="count danger" id="notifCount">0</span></button>
      <button class="k-nav-item" data-tab="pending"><i data-lucide="clock"></i> طلبات المراجعة <span class="count warn" id="pendCount">0</span></button>
      <button class="k-nav-item" data-tab="merchants"><i data-lucide="store"></i> التجار <span class="count green" id="mcCount">0</span></button>
      <button class="k-nav-item" data-tab="drivers"><i data-lucide="bike"></i> المناديب <span class="count blue" id="drCount">0</span></button>
      <div class="k-nav-sep">الطلبات</div>
      <button class="k-nav-item" data-tab="orders"><i data-lucide="package"></i> كل الطلبات <span class="count" id="ocCount">0</span></button>
      <button class="k-nav-item" data-tab="products"><i data-lucide="package-plus"></i> المنتجات <span class="count blue" id="prodCount">0</span></button>
      <button class="k-nav-item" data-tab="ratings"><i data-lucide="star"></i> التقييمات <span class="count purple" id="rtCount">0</span></button>
      <div class="k-nav-sep">النظام</div>
      <button class="k-nav-item" data-tab="analytics"><i data-lucide="bar-chart-3"></i> التحليلات</button>
      <button class="k-nav-item" data-tab="settings"><i data-lucide="settings"></i> الإعدادات</button>
    </nav>
    <div class="k-sidebar-foot">
      <button class="k-nav-item" onclick="toggleTheme()"><i data-lucide="sun-moon"></i> تبديل المظهر</button>
      <a class="k-nav-item" href="index.html"><i data-lucide="home"></i> الموقع الرئيسي</a>
      <a class="k-nav-item" href="driver.html"><i data-lucide="bike"></i> واجهة المندوب</a>
      <button class="k-nav-item" onclick="doLogout()" style="color:var(--danger)"><i data-lucide="log-out"></i> تسجيل الخروج</button>
    </div>
  </aside>
  <main class="k-main">
    <header class="k-topbar">
      <button class="k-icon-btn k-burger" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
      <button class="k-icon-btn" id="adminBackBtn" onclick="ktAdminBack()" title="رجوع" style="display:none;color:var(--gold);border-color:rgba(255,184,0,.35);background:linear-gradient(135deg,rgba(255,184,0,.1),rgba(255,184,0,.02))"><i data-lucide="arrow-right"></i></button>
      <div class="k-topbar-title">
        <span id="pageTitle">لوحة القيادة</span>
        <small id="pageSub">نظرة عامة</small>
      </div>
      <div class="k-topbar-actions">
        <button class="k-icon-btn" onclick="switchTab('notifications')" title="الإشعارات">
          <i data-lucide="bell"></i>
          <span class="dot" id="notifDot" style="display:none">0</span>
        </button>
        <a href="index.html" class="k-icon-btn" title="الموقع"><i data-lucide="external-link"></i></a>
        <button class="k-icon-btn" onclick="refresh()" title="تحديث"><i data-lucide="refresh-cw"></i></button>
      </div>
    </header>
    <div class="k-content" id="content"></div>
  </main>
</div>

<div class="k-modal-bd" id="modalBd"><div class="k-modal" id="modalContent"></div></div>
<div class="k-fb-status" id="kFbStatus">🔥 Firebase</div>
<div class="kt-lightbox" id="ktLightbox" onclick="ktCloseLightbox()"><button class="close" onclick="ktCloseLightbox()">✕</button><img id="ktLightboxImg" src="" alt=""></div>

<script>
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.from(document.querySelectorAll(s)); };
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function money(n){ return Number(n||0).toFixed(0) + ' ج.م'; }
function refreshIcons(){ if (window.lucide && typeof lucide.createIcons === 'function'){ try { lucide.createIcons(); } catch(e){} } }
function LS_get(k,d){ try{ var v = localStorage.getItem('kanteen:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function LS_set(k,v){ try{ localStorage.setItem('kanteen:'+k, JSON.stringify(v)); }catch(e){} }

function toast(msg, type){
  var t = document.createElement('div');
  t.className = 'k-toast' + (type ? ' ' + type : '');
  t.innerHTML = '<span>' + msg + '</span>';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 300); }, 3200);
}
function ktShowFbStatus(text, isError){
  var el = document.getElementById('kFbStatus'); if (!el) return;
  el.textContent = text; el.classList.add('show');
  if (isError) el.classList.add('err'); else el.classList.remove('err');
  setTimeout(function(){ el.classList.remove('show'); }, 3000);
}

var currentTab = 'dashboard';
var ADMIN_UID = null, ADMIN_EMAIL = null;
var FB_ORDERS = [], FB_MERCHANTS = [], FB_NOTIFS = [], FB_DRIVERS = [], FB_RATINGS = [], FB_GLOBAL_PRODUCTS = [];
var _unsubs = {};

var _fbWaitRetries = 0;
function ktWaitFirebase(callback){
  if (window.KT_FB && window.KT_FB.init){
    try { var init = window.KT_FB.init(); if (init){ _fbWaitRetries = 0; callback(init); return; } } catch(e){}
  }
  if (_fbWaitRetries < 40){ _fbWaitRetries++; setTimeout(function(){ ktWaitFirebase(callback); }, 300); }
}

function ktTimeAgo(iso){
  if (!iso) return '—';
  var d = new Date(iso);
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'الآن';
  if (diff < 3600) return Math.floor(diff/60) + ' د';
  if (diff < 86400) return Math.floor(diff/3600) + ' س';
  if (diff < 604800) return Math.floor(diff/86400) + ' ي';
  return d.toLocaleDateString('ar-EG');
}
function ktOpenLightbox(src){ var lb = document.getElementById('ktLightbox'); var img = document.getElementById('ktLightboxImg'); if (!lb || !img) return; img.src = src; lb.classList.add('open'); }
function ktCloseLightbox(){ var lb = document.getElementById('ktLightbox'); if (lb) lb.classList.remove('open'); }

function doLogin(){
  var email = ($('#inpEmail').value || '').trim().toLowerCase();
  var pass = $('#inpPass').value || '';
  var err = $('#errBox');
  err.style.display = 'none';
  if (!email || !pass){ err.textContent = '❌ املأ جميع الحقول'; err.style.display = 'block'; return; }
  var btn = $('#loginBtn');
  btn.disabled = true; btn.innerHTML = 'جاري الدخول...';
  ktWaitFirebase(function(init){
    init.auth.signInWithEmailAndPassword(email, pass)
      .then(function(cred){
        return init.db.collection('admins').doc(cred.user.uid).get().then(function(doc){
          if (!doc.exists){ init.auth.signOut(); throw new Error('هذا الحساب ليس Admin'); }
          ADMIN_UID = cred.user.uid;
          ADMIN_EMAIL = cred.user.email;
          sessionStorage.setItem('kanteen:admin_uid', ADMIN_UID);
          startDashboard();
        });
      })
      .catch(function(e){
        var msg = e.message || 'فشل الدخول';
        if (e.code === 'auth/user-not-found') msg = '❌ لا يوجد حساب بهذا البريد';
        else if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = '❌ بيانات الدخول غير صحيحة';
        else if (e.code === 'auth/invalid-email') msg = '❌ البريد غير صحيح';
        else if (e.code === 'auth/too-many-requests') msg = '⚠️ حاولت كثيراً — انتظر دقيقة';
        err.textContent = msg; err.style.display = 'block';
        btn.disabled = false; btn.innerHTML = 'دخول';
        try { if (window.KT_SOUND) KT_SOUND.alert(); } catch(e){}
      });
  });
}
function doLogout(){
  if (!confirm('هل تريد تسجيل الخروج؟')) return;
  Object.keys(_unsubs).forEach(function(k){ try { _unsubs[k] && _unsubs[k](); } catch(e){} });
  _unsubs = {};
  sessionStorage.removeItem('kanteen:admin_uid');
  ktWaitFirebase(function(init){ init.auth.signOut().then(function(){ location.reload(); }); });
}

function startDashboard(){
  $('#loginScreen').style.display = 'none';
  $('#appShell').classList.add('active');
  try { if (window.KT_SOUND) setTimeout(function(){ KT_SOUND.welcome(); }, 400); } catch(e){}
  toast('✅ مرحباً بك يا Admin', 'success');
  ktWaitFirebase(function(init){
    init.db.collection('merchants').limit(1).get()
      .then(function(){ ktShowFbStatus('🔥 Firebase متصل', false); })
      .catch(function(err){
        if (err && err.code === 'permission-denied') ktShowFbStatus('⚠️ راجع Firestore Rules', true);
        else ktShowFbStatus('⚠️ Firebase فشل', true);
      });
    ktInitListeners();
  });
  switchTab('dashboard');
  setTimeout(refreshIcons, 300);
  setTimeout(refreshIcons, 800);
  setTimeout(refreshIcons, 1500);
}

function ktInitListeners(){
  ktWaitFirebase(function(init){
    try {
      console.log('🔄 Starting orders listener...');
      _unsubs.orders = KT_FB.listenOrders(function(orders){
        FB_ORDERS = orders || [];
        console.log('📦 Orders received:', FB_ORDERS.length);
        updateCounts();
        if (currentTab === 'dashboard') renderDashboard($('#content'));
        else if (currentTab === 'orders') renderOrders($('#content'));
        else if (currentTab === 'analytics') renderAnalytics($('#content'));
        else if (currentTab === 'notifications') renderNotifications($('#content'));
      });
    } catch(e){ console.error('❌ orders:', e); }
    try {
      _unsubs.merchants = KT_FB.listenMerchants(function(merchants){
        FB_MERCHANTS = merchants || [];
        updateCounts();
        if (currentTab === 'dashboard') renderDashboard($('#content'));
        else if (currentTab === 'pending') renderPending($('#content'));
        else if (currentTab === 'merchants') renderMerchants($('#content'));
      });
    } catch(e){ console.warn('merchants:', e); }
    try {
      _unsubs.notifs = KT_FB.listenNotifications(function(notifs){
        FB_NOTIFS = notifs || [];
        updateCounts();
        if (currentTab === 'notifications') renderNotifications($('#content'));
      });
    } catch(e){ console.warn('notifs:', e); }
    try {
      _unsubs.drivers = init.db.collection('drivers').onSnapshot(function(snap){
        FB_DRIVERS = snap.docs.map(function(d){ return Object.assign({ _fbId: d.id }, d.data()); });
        updateCounts();
        if (currentTab === 'drivers') renderDrivers($('#content'));
        else if (currentTab === 'dashboard') renderDashboard($('#content'));
      }, function(e){ console.warn('drivers:', e.code); });
    } catch(e){ console.warn('drivers:', e); }
    try {
      _unsubs.ratings = init.db.collection('ratings').limit(200).onSnapshot(function(snap){
        FB_RATINGS = snap.docs.map(function(d){ return Object.assign({ _fbId: d.id }, d.data()); });
        updateCounts();
        if (currentTab === 'ratings') renderRatings($('#content'));
      }, function(e){ console.warn('ratings:', e.code); });
    } catch(e){ console.warn('ratings:', e); }
    try {
      if (typeof KT_FB.listenGlobalProducts === 'function'){
        _unsubs.globalProducts = KT_FB.listenGlobalProducts(function(prods){
          FB_GLOBAL_PRODUCTS = prods || [];
          var el = document.getElementById('prodCount');
          if (el) el.textContent = FB_GLOBAL_PRODUCTS.length;
          if (currentTab === 'products') renderProducts($('#content'));
          if (currentTab === 'dashboard') renderDashboard($('#content'));
        });
      }
    } catch(e){ console.warn('globalProducts:', e); }
  });
}

function updateCounts(){
  var pending = FB_MERCHANTS.filter(function(m){ return m.status === 'pending'; }).length;
  var approved = FB_MERCHANTS.filter(function(m){ return m.status === 'approved' || !m.status; }).length;
  var pendingDrivers = FB_DRIVERS.filter(function(d){ return d.status === 'pending'; }).length;
  var onlineDrivers = FB_DRIVERS.filter(function(d){ return d.online && (d.status === 'approved' || !d.status); }).length;
  var unreadNotifs = FB_NOTIFS.filter(function(n){ return !n.read; }).length;
  var el;
  if ((el = $('#pendCount'))) el.textContent = pending;
  if ((el = $('#mcCount'))) el.textContent = approved;
  if ((el = $('#ocCount'))) el.textContent = FB_ORDERS.length;
  if ((el = $('#drCount'))) el.textContent = onlineDrivers + pendingDrivers;
  if ((el = $('#notifCount'))) el.textContent = unreadNotifs;
  if ((el = $('#rtCount'))) el.textContent = FB_RATINGS.length;
  if ((el = $('#prodCount'))) el.textContent = FB_GLOBAL_PRODUCTS.length;
  var dot = document.getElementById('notifDot');
  if (dot){ if (unreadNotifs > 0){ dot.style.display = 'grid'; dot.textContent = unreadNotifs; } else { dot.style.display = 'none'; } }
}

function switchTab(tab){
  currentTab = tab;
  var backBtn = document.getElementById('adminBackBtn');
  if (backBtn) backBtn.style.display = (tab === 'dashboard') ? 'none' : 'grid';
  $$('.k-nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.tab === tab); });
  var titles = {
    dashboard:['لوحة القيادة','نظرة عامة على المتجر'],
    notifications:['الإشعارات','تنبيهات الدفع والطلبات'],
    pending:['طلبات المراجعة','طلبات التجار والمناديب'],
    merchants:['التجار','المتاجر المعتمدة والموقوفة'],
    drivers:['المناديب','إدارة مناديب التوصيل'],
    orders:['الطلبات','كل الطلبات'],
    products:['المنتجات','إضافة وتعديل وحذف المنتجات'],
    ratings:['التقييمات','آراء العملاء'],
    analytics:['التحليلات','رسوم بيانية وإحصائيات'],
    settings:['الإعدادات','إعدادات النظام']
  };
  $('#pageTitle').textContent = (titles[tab]||titles.dashboard)[0];
  $('#pageSub').textContent = (titles[tab]||titles.dashboard)[1];
  document.getElementById('sidebar').classList.remove('open');
  var c = $('#content');
  updateCounts();
  if (tab === 'dashboard') renderDashboard(c);
  else if (tab === 'notifications') renderNotifications(c);
  else if (tab === 'pending') renderPending(c);
  else if (tab === 'merchants') renderMerchants(c);
  else if (tab === 'drivers') renderDrivers(c);
  else if (tab === 'orders') renderOrders(c);
  else if (tab === 'products') renderProducts(c);
  else if (tab === 'ratings') renderRatings(c);
  else if (tab === 'analytics') renderAnalytics(c);
  else if (tab === 'settings') renderSettings(c);
  refreshIcons();
}
document.addEventListener('click', function(e){
  var item = e.target.closest('.k-nav-item[data-tab]');
  if (item){ switchTab(item.dataset.tab); }
});

function ktAdminBack(){
  var modal = document.getElementById('modalBd');
  if (modal && modal.classList.contains('open')){ closeModal(); return; }
  if (currentTab !== 'dashboard'){ switchTab('dashboard'); return; }
  if (confirm('تسجيل الخروج؟')) doLogout();
}

function renderDashboard(el){
  var pending = FB_MERCHANTS.filter(function(m){ return m.status === 'pending'; });
  var approved = FB_MERCHANTS.filter(function(m){ return m.status === 'approved' || !m.status; });
  var newOrders = FB_ORDERS.filter(function(o){ return o.status === 'placed'; });
  var deliveredOrders = FB_ORDERS.filter(function(o){ return o.status === 'delivered'; });
  var inProgress = FB_ORDERS.filter(function(o){ return ['confirmed','preparing','out'].indexOf(o.status) !== -1; });
  var revenue = deliveredOrders.reduce(function(s,o){ return s + (o.total||0); }, 0);
  var onlineDrivers = FB_DRIVERS.filter(function(d){ return d.online && (d.status === 'approved' || !d.status); });
  var pendingDrivers = FB_DRIVERS.filter(function(d){ return d.status === 'pending'; });

  function statCard(opts){
    return '<div class="k-stat ' + (opts.color || '') + '" onclick="switchTab(\'' + opts.tab + '\')">' +
      '<span class="k-stat-arrow">↗</span>' +
      '<div class="k-stat-icon"><i data-lucide="' + opts.icon + '"></i></div>' +
      '<div class="k-stat-label">' + opts.label + '</div>' +
      '<div class="k-stat-value">' + opts.value + '</div>' +
    '</div>';
  }

  var html = '';
  html += '<div class="kt-anim-1"><div class="k-stats">';
  html += statCard({tab:'notifications', icon:'bell-ring', label:'إشعارات جديدة', value:FB_NOTIFS.filter(function(n){return !n.read;}).length, color:'danger'});
  html += statCard({tab:'orders', icon:'package', label:'طلبات جديدة', value:newOrders.length, color:'warn'});
  html += statCard({tab:'pending', icon:'clock', label:'تجار قيد المراجعة', value:pending.length, color:'gold'});
  html += statCard({tab:'drivers', icon:'bike', label:'مناديب قيد المراجعة', value:pendingDrivers.length, color:'blue'});
  html += '</div></div>';

  html += '<div class="kt-anim-2"><div class="k-stats">';
  html += statCard({tab:'merchants', icon:'store', label:'التجار المعتمدون', value:approved.length, color:'purple'});
  html += statCard({tab:'drivers', icon:'wifi', label:'مناديب متصلون', value:onlineDrivers.length, color:'green'});
  html += statCard({tab:'orders', icon:'check-circle-2', label:'طلبات مكتملة', value:deliveredOrders.length, color:'green'});
  html += statCard({tab:'orders', icon:'loader', label:'قيد التنفيذ', value:inProgress.length, color:'blue'});
  html += statCard({tab:'products', icon:'package-plus', label:'المنتجات العامة', value:FB_GLOBAL_PRODUCTS.length, color:'gold'});
  html += '</div></div>';

  html += '<div class="kt-anim-3"><div class="k-stats">';
  html += statCard({tab:'analytics', icon:'wallet', label:'الإيرادات', value:money(revenue), color:'gold'});
  html += statCard({tab:'orders', icon:'clock-4', label:'دفعات معلقة', value:FB_ORDERS.filter(function(o){ return o.paymentStatus === 'pending'; }).length, color:'warn'});
  html += '</div></div>';

  // تنبيهات عاجلة
  if (newOrders.length || pending.length || pendingDrivers.length){
    html += '<div class="k-card kt-anim-4" style="border-color:rgba(239,68,68,.5);background:linear-gradient(135deg,rgba(239,68,68,.08),transparent)">';
    html += '<div class="k-card-head"><h3><i data-lucide="alert-circle" style="color:var(--danger)"></i> تنبيهات عاجلة</h3></div>';
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap">';
    if (newOrders.length) html += '<button class="k-btn k-btn-success" onclick="switchTab(\'orders\')">📦 ' + newOrders.length + ' طلب جديد</button>';
    if (pending.length) html += '<button class="k-btn k-btn-gold" onclick="switchTab(\'pending\')">⏰ ' + pending.length + ' تاجر</button>';
    if (pendingDrivers.length) html += '<button class="k-btn k-btn-primary" onclick="switchTab(\'drivers\')">🛵 ' + pendingDrivers.length + ' مندوب</button>';
    html += '</div></div>';
  }

  el.innerHTML = html;
  refreshIcons();
}

/* ═══════════════════════════════════════════════════════════
   📦 ORDERS — مع تأكيد + تفاصيل
   ═══════════════════════════════════════════════════════════ */
function statusLabels(s){
  var map = {
    placed: {label:'🆕 جديد', pill:'k-pill-gold'},
    pending_payment: {label:'⏳ دفع معلق', pill:'k-pill-gold'},
    confirmed: {label:'✅ مؤكد', pill:'k-pill-info'},
    preparing: {label:'📦 تحضير', pill:'k-pill-info'},

    delivered: {label:'✓ تم التسليم', pill:'k-pill-fresh'},

  };
  return map[s] || map.placed;
}

function ktAdminConfirmOrder(orderFbId, notifFbId){
  if (!orderFbId){ toast('⚠️ معرف الطلب غير موجود', 'error'); return; }
  var order = FB_ORDERS.find(function(o){ return o._fbId === orderFbId; });
  if (!order){ toast('⚠️ الطلب غير موجود', 'error'); return; }
  if (order.status !== 'placed' && order.status !== 'pending_payment'){
    toast('ℹ️ الطلب مؤكد بالفعل');
    return;
  }
  if (!confirm('✅ تأكيد الطلب #' + order.id + '؟')) return;

  ktWaitFirebase(function(init){
    init.db.collection('orders').doc(orderFbId).update({
      status: 'confirmed',
      confirmedAt: new Date().toISOString(),
      confirmedBy: 'admin',
      confirmedByName: ADMIN_EMAIL || 'الإدارة',
      statusHistory: firebase.firestore.FieldValue.arrayUnion({ status: 'confirmed', at: new Date().toISOString() })
    }).then(function(){
      if (window.KT_SOUND) KT_SOUND.success();
      toast('✅ تم تأكيد الطلب ' + order.id, 'success');
      if (notifFbId) KT_FB.markNotificationRead(notifFbId);
    }).catch(function(e){ toast('❌ ' + (e.message || 'فشل'), 'error'); });
  });
}

    html += '<div class="k-merchant-card ' + (n.read ? '' : 'pending') + '" style="grid-template-columns:auto 1fr auto">';
    html += '<div class="k-merchant-avatar" style="background:linear-gradient(135deg,var(--gold),var(--brand))">' + typeIcon + '</div>';
    html += '<div class="k-merchant-info">';
    html += '<h4>' + typeTitle + ' <span class="k-pill ' + (n.read ? 'k-pill-info' : 'k-pill-danger') + '">' + (n.read ? 'مقروء' : 'جديد') + '</span></h4>';
    if (n.orderId) html += '<div class="meta"><i data-lucide="package"></i> الطلب: <b>' + esc(n.orderId) + '</b></div>';
    if (n.customer) html += '<div class="meta"><i data-lucide="user"></i> ' + esc(n.customer.name || '') + ' · 📞 ' + esc(n.customer.phone || '') + '</div>';
    if (n.merchantName) html += '<div class="meta"><i data-lucide="store"></i> ' + esc(n.merchantName) + '</div>';
    if (n.driverName) html += '<div class="meta"><i data-lucide="bike"></i> ' + esc(n.driverName) + '</div>';
    if (n.total) html += '<div class="meta"><i data-lucide="wallet"></i> <b style="color:var(--gold)">' + money(n.total) + '</b></div>';
    html += '<div class="meta"><i data-lucide="clock"></i> ' + ktTimeAgo(n.createdAt) + '</div>';
    html += '</div>';
    html += '<div class="k-merchant-actions">';
    if (canConfirm) html += '<button class="k-btn k-btn-success k-btn-sm" onclick="ktAdminConfirmOrder(\'' + orderObj._fbId + '\',\'' + n._fbId + '\')"><i data-lucide="check-circle"></i> تأكيد</button>';
    if (orderObj) html += '<button class="k-btn k-btn-glass k-btn-sm" onclick="ktViewOrderDetails(\'' + orderObj._fbId + '\')"><i data-lucide="eye"></i> تفاصيل</button>';
    if (n.type === 'new_merchant') html += '<button class="k-btn k-btn-primary k-btn-sm" onclick="switchTab(\'pending\')">مراجعة</button>';
    if (n.type === 'new_driver') html += '<button class="k-btn k-btn-primary k-btn-sm" onclick="switchTab(\'drivers\')">مراجعة</button>';
    if (!n.read) html += '<button class="k-btn k-btn-glass k-btn-sm" onclick="KT_FB.markNotificationRead(\'' + n._fbId + '\')">✓</button>';
    html += '<button class="k-btn k-btn-danger k-btn-sm" onclick="KT_FB.deleteNotification(\'' + n._fbId + '\')"><i data-lucide="trash-2"></i></button>';
    html += '</div></div>';
  });

  html += '</div>';
  el.innerHTML = html;
  refreshIcons();
}

  FB_NOTIFS.forEach(function(n){

function saveGlobalProduct(fbId){
  var nameAr = document.getElementById('gpNameAr').value.trim();
  var nameEn = document.getElementById('gpNameEn').value.trim();
  var brand = document.getElementById('gpBrand').value.trim();
  var cat = document.getElementById('gpCat').value;
  var newPrice = parseFloat(document.getElementById('gpPrice').value);
  var oldPrice = parseFloat(document.getElementById('gpOldPrice').value) || 0;
  var stock = parseInt(document.getElementById('gpStock').value) || 0;
  var weight = document.getElementById('gpWeight').value.trim();
  var emoji = document.getElementById('gpEmoji').value.trim() || '🛒';
  var image = document.getElementById('gpImage').value.trim();

  if (!nameAr){ toast('❌ اكتب اسم المنتج', 'error'); return; }
  if (!newPrice || newPrice <= 0){ toast('❌ اكتب سعر صحيح', 'error'); return; }

  var off = 0, discount = 0, price = newPrice;
  if (oldPrice && oldPrice > newPrice){
    off = Math.round((1 - newPrice / oldPrice) * 100);
    discount = newPrice;
    price = oldPrice;
  }

  var data = {
    nameAr: nameAr, nameEn: nameEn || nameAr, brand: brand, cat: cat,
    price: price, discount: discount, off: off,
    stock: stock, weight: weight, emoji: emoji, image: image,
    rating: 4.5, reviews: 0
  };

  if (!window.KT_FB){ toast('⏳ Loading...'); return; }
  KT_FB.saveProduct(data, fbId).then(function(id){
    if (id){
      if (window.KT_SOUND) KT_SOUND.success();
      toast(fbId ? '✅ تم تعديل المنتج' : '✅ تم إضافة المنتج', 'success');
      closeModal();
    } else {
      toast('❌ فشل الحفظ', 'error');
    }
  });
}

function deleteGlobalProduct(fbId){
  if (!confirm('حذف المنتج نهائياً؟')) return;
  KT_FB.deleteProduct(fbId).then(function(ok){
    if (ok){
      if (window.KT_SOUND) KT_SOUND.success();
      toast('✅ تم الحذف', 'success');
    } else {
      toast('❌ فشل الحذف', 'error');
    }
  });
}

function saveManualMerchant(){
  var name = $('#amName').value.trim();
  var owner = $('#amOwner').value.trim();
  var phone = $('#amPhone').value.trim().replace(/\s/g,'');
  var type = $('#amType').value;
  var pass = $('#amPass').value;
  var address = $('#amAddress').value.trim();
  if (!name || !owner || !phone || !address || !pass){ toast('❌ املأ كل الحقول', 'error'); return; }
  if (phone.startsWith('0')) phone = '+20' + phone.slice(1);
  ktWaitFirebase(function(init){
    init.db.collection('merchants').add({
      id: 'merchant_' + phone.replace(/\D/g,''),
      name: name, owner: owner, phone: phone,
      password: pass, type: type, address: address,
      status: 'approved', products: [],
      createdAt: new Date().toISOString(),
      approvedAt: new Date().toISOString(),
      _serverCreatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){ toast('✅ تم إضافة التاجر', 'success'); closeModal(); })
    .catch(function(e){ toast('❌ ' + e.message, 'error'); });
  });
}

/* ═══ MODAL / THEME ═══ */
function openModal(html){ $('#modalContent').innerHTML = html; $('#modalBd').classList.add('open'); document.body.style.overflow = 'hidden'; refreshIcons(); }
function closeModal(){ $('#modalBd').classList.remove('open'); document.body.style.overflow = ''; }

var currentTheme = LS_get('theme', 'dark');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  currentTheme = t; LS_set('theme', t);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#02060f' : '#f7f8fb');
}
function toggleTheme(){ applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); toast(currentTheme === 'dark' ? '🟠 داكن' : '⚪ فاتح', 'success'); }
applyTheme(currentTheme);
function refresh(){ toast('🔄 تحديث...'); switchTab(currentTab); }

/* ═══ INIT ═══ */
document.addEventListener('DOMContentLoaded', function(){
  refreshIcons();
  setTimeout(refreshIcons, 500);
  setTimeout(refreshIcons, 1500);
  if (window.KT_SOUND){
    var soundEnabled = LS_get('sound_enabled', true);
    if (!soundEnabled) KT_SOUND.disable();
    KT_SOUND.setVolume(LS_get('sound_volume', 0.35));
  }
  var savedUid = sessionStorage.getItem('kanteen:admin_uid');
  if (savedUid){
    ktWaitFirebase(function(init){
      init.auth.onAuthStateChanged(function(user){
        if (user && user.uid === savedUid){
          init.db.collection('admins').doc(user.uid).get().then(function(doc){
            if (doc.exists){ ADMIN_UID = user.uid; ADMIN_EMAIL = user.email; startDashboard(); }
          });
        }
      });
    });
  }
  var pw = $('#inpPass'); if (pw) pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  $('#modalBd').addEventListener('click', function(e){ if (e.target.id === 'modalBd') closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); ktCloseLightbox(); } });
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(e){}); });
  }
  console.log('%c🎛️ Admin Panel v11.1 — Full Fix','background:linear-gradient(135deg,#ff6b35,#ffb800);color:#fff;padding:6px 14px;border-radius:6px;font-weight:800;font-size:13px');
});

});
