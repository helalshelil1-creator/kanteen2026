    if (hasCustomerLoc && hasDriverLoc) legend += '<span class="dist">المسافة: ' + distance.toFixed(1) + ' كم</span>';
    legend += '</div>';
    
    mapHTML += legend;
    mapHTML += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
    if (hasCustomerLoc) mapHTML += '<a href="https://www.google.com/maps?q=' + c.lat + ',' + c.lng + '" target="_blank" class="k-btn k-btn-glass k-btn-sm" style="flex:1"><i data-lucide="map-pin"></i> موقع العميل</a>';
    if (hasDriverLoc) mapHTML += '<a href="https://www.google.com/maps?q=' + driver.lat + ',' + driver.lng + '" target="_blank" class="k-btn k-btn-glass k-btn-sm" style="flex:1"><i data-lucide="map-pin"></i> موقع المندوب</a>';
    mapHTML += '</div>';
    if (hasCustomerLoc && hasDriverLoc){
      mapHTML += '<a href="https://www.google.com/maps/dir/?api=1&origin=' + driver.lat + ',' + driver.lng + '&destination=' + c.lat + ',' + c.lng + '" target="_blank" class="k-btn k-btn-primary k-btn-block" style="margin-top:10px"><i data-lucide="navigation"></i> المسار الكامل في Google Maps</a>';
    }
  } else {
    mapHTML = '<div class="kt-doc-empty" style="padding:60px 20px"><div style="font-size:52px;margin-bottom:12px">🗺️</div><div>لا تتوفر إحداثيات الموقع</div><div style="font-size:12px;color:var(--ink-4);margin-top:8px">العميل والمندوب لم يحددا موقعهما</div></div>';
  }
  
  var tabTracking = '<div class="kt-tab-panel" data-op="tracking">' + mapHTML + '</div>';
  
  // Quick actions
  var quickActions = '';
  if (o.status === 'placed'){
    quickActions = '<button class="success" onclick="confirmOrder(\'' + o._fbId + '\');closeModal()"><i data-lucide="check-circle"></i> تأكيد الطلب</button>';
  }
  quickActions +=
    (c.phone ? '<a href="tel:' + esc(c.phone) + '"><i data-lucide="phone"></i> اتصال بالعميل</a>' : '') +
    (c.phone ? '<a href="https://wa.me/2' + String(c.phone).replace(/\D/g,'') + '" target="_blank"><i data-lucide="message-circle"></i> واتساب</a>' : '') +
    (driver && driver.phone ? '<a href="tel:' + esc(driver.phone) + '"><i data-lucide="bike"></i> اتصال بالمندوب</a>' : '') +
    '<button onclick="closeModal()"><i data-lucide="x-circle"></i> إغلاق</button>';
  
  openModal(
    '<div class="kt-modal-topbar">' +
      '<div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:26px;flex:none">📦</div>' +
      '<div class="kt-modal-title">' +
        '<b>طلب #' + esc(o.id) + '</b>' +
        '<span>' + (o.createdAt ? new Date(o.createdAt).toLocaleString('ar-EG') : '—') + '</span>' +
      '</div>' +
      '<span class="k-pill ' + statusLabels(o.status).pill + '" style="align-self:center">' + statusLabels(o.status).label + '</span>' +
      '<button class="k-modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>' +
    '</div>' +
    '<div class="kt-kpis">' + kpis + '</div>' +
    tabs +
    tabDetails + tabItems + tabTracking +
    '<div class="kt-quick-actions">' + quickActions + '</div>'
  );
  
  // Dual map
  if ((hasCustomerLoc || hasDriverLoc) && window.L){
    setTimeout(function(){
      var el = document.getElementById('orderTrackMap');
      if (!el) return;
      
      var centerLat = 0, centerLng = 0, points = [];
      if (hasCustomerLoc){ points.push([c.lat, c.lng]); centerLat += c.lat; centerLng += c.lng; }
      if (hasDriverLoc){ points.push([driver.lat, driver.lng]); centerLat += driver.lat; centerLng += driver.lng; }
      centerLat /= points.length;
      centerLng /= points.length;
      
      var map = L.map(el, { zoomControl: true, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      
      if (hasCustomerLoc){
        L.circleMarker([c.lat, c.lng], { radius: 12, fillColor: '#ff6b35', color: '#fff', weight: 3, fillOpacity: 1 })
          .addTo(map).bindPopup('🏠 موقع العميل');
      }
      if (hasDriverLoc){
        L.circleMarker([driver.lat, driver.lng], { radius: 12, fillColor: '#3b82f6', color: '#fff', weight: 3, fillOpacity: 1 })
          .addTo(map).bindPopup('🛵 موقع المندوب');
      }
      if (points.length > 1){
        L.polyline(points, { color: '#ffb800', weight: 3, dashArray: '8,8', opacity: 0.8 }).addTo(map);
      }
      
      setTimeout(function(){
        if (points.length === 1){ map.setView(points[0], 15); }
        else { map.fitBounds(points, { padding: [40, 40] }); }
      }, 100);
      
      _modalMaps.push(map);
      setTimeout(function(){ map.invalidateSize(); }, 200);
    }, 300);
  }
  refreshIcons();
}

function ktOrderTab(tab){
  $$('.kt-tab[data-ot]').forEach(function(b){ b.classList.toggle('on', b.dataset.ot === tab); });
  $$('.kt-tab-panel[data-op]').forEach(function(p){ p.classList.toggle('on', p.dataset.op === tab); });
  setTimeout(function(){
    _modalMaps.forEach(function(m){ try { m.invalidateSize(); } catch(e){} });
  }, 100);
  refreshIcons();
}

function exportOrders(){
  var csv = 'OrderID,Customer,Phone,Merchant,Total,Payment,Status,Date\n';
  FB_ORDERS.forEach(function(o){
    csv += [csvEscape(o.id), csvEscape((o.customer && o.customer.name) || ''), csvEscape((o.customer && o.customer.phone) || ''), csvEscape(o.merchantName || ''), (o.total || 0), csvEscape(o.payment || ''), csvEscape(o.status || ''), csvEscape(o.createdAt || '')].join(',') + '\n';
  });
  downloadCSV(csv, 'orders.csv');
}

/* ═══ CSV HELPERS ═══ */
function csvEscape(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function downloadCSV(csv, filename){
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  toast('✅ تم التصدير', 'success');
}
function exportMerchants(){
  var csv = 'Name,Owner,Phone,Type,Address,Products,Status\n';
  FB_MERCHANTS.forEach(function(m){
    csv += [csvEscape(m.name), csvEscape(m.owner), csvEscape(m.phone), csvEscape(m.type), csvEscape(m.address), (m.products ? m.products.length : 0), csvEscape(m.status || 'approved')].join(',') + '\n';
  });
  downloadCSV(csv, 'merchants.csv');
}

function saveManualMerchant(){

  var phone = $('#amPhone').value.trim().replace(/\s/g,'');
  var whatsapp = $('#amWhatsapp').value.trim().replace(/\s/g,'');

function renderDriverCard(d, status){
  var isOnline = d.online;
  var avatarHTML = d.profilePhoto
    ? '<img src="' + d.profilePhoto + '" alt="' + esc(d.name) + '">'
    : '🛵';
  var statusPill = status === 'pending' ? '<span class="k-pill k-pill-gold">⏳ قيد المراجعة</span>' :
                   status === 'suspended' ? '<span class="k-pill k-pill-danger">⏸️ موقوف</span>' :
                   '<span class="k-pill ' + (isOnline ? 'k-pill-fresh' : 'k-pill-danger') + '">' + (isOnline ? '🟢 متصل' : '🔴 غير متصل') + '</span>';
  var actions = '';
  if (status === 'pending'){
    actions = '<button class="k-btn k-btn-success k-btn-sm" onclick="approveDriver(\'' + d._fbId + '\')"><i data-lucide="check"></i> قبول</button>' +
      '<button class="k-btn k-btn-primary k-btn-sm" onclick="viewDriver(\'' + d._fbId + '\')"><i data-lucide="eye"></i> عرض</button>' +
      '<button class="k-btn k-btn-danger k-btn-sm" onclick="rejectDriver(\'' + d._fbId + '\')"><i data-lucide="x"></i> رفض</button>';
  } else {
    actions = '<button class="k-btn k-btn-primary k-btn-sm" onclick="viewDriver(\'' + d._fbId + '\')"><i data-lucide="eye"></i> عرض</button>' +
      '<button class="k-btn k-btn-danger k-btn-sm" onclick="suspendDriver(\'' + d._fbId + '\')"><i data-lucide="pause-circle"></i> إيقاف</button>';
  }
  var lastSeen = d.lastSeen ? new Date(d.lastSeen.seconds ? d.lastSeen.seconds*1000 : d.lastSeen).toLocaleString('ar-EG') : '—';
  return '<div class="k-merchant-card ' + (status === 'pending' ? 'pending' : (isOnline ? 'approved' : 'suspended')) + '" style="margin-bottom:14px">' +
    '<div class="k-merchant-avatar" style="background:linear-gradient(135deg,' + (isOnline ? 'var(--fresh),var(--fresh-2)' : 'var(--info),#60a5fa') + ')">' + avatarHTML + '</div>' +

      '<h4>' + esc(d.name || 'مندوب') + ' ' + statusPill + '</h4>' +
      '<div class="meta"><i data-lucide="phone"></i>' + esc(d.phone || '—') + (d.whatsapp ? ' • 💬 ' + esc(d.whatsapp) : '') + '</div>' +
      (d.email ? '<div class="meta"><i data-lucide="mail"></i>' + esc(d.email) + '</div>' : '') +

    '</div>' +

function approveDriver(fbId){
  if (!fbId) return;
  ktWaitFirebase(function(init){
    init.db.collection('drivers').doc(fbId).update({ status: 'approved', approvedAt: new Date().toISOString() })
      .then(function(){ try { if (window.KT_SOUND) KT_SOUND.success(); } catch(e){}; toast('✅ تم قبول المندوب', 'success'); })
      .catch(function(e){ toast('❌ ' + (e.message || 'فشل'), 'error'); });
  });
}
function rejectDriver(fbId){
  if (!confirm('رفض هذا المندوب؟')) return;
  ktWaitFirebase(function(init){
    init.db.collection('drivers').doc(fbId).update({ status: 'rejected', rejectedAt: new Date().toISOString() })
      .then(function(){ toast('❌ تم الرفض', 'error'); });
  });
}
function suspendDriver(fbId){
  if (!confirm('إيقاف هذا المندوب؟')) return;
  ktWaitFirebase(function(init){
    init.db.collection('drivers').doc(fbId).update({ status: 'suspended', online: false, suspendedAt: new Date().toISOString() })
      .then(function(){ toast('⏸️ تم الإيقاف', 'success'); });
  });
}

  var avgDriver = FB_RATINGS.reduce(function(s, r){ return s + (r.driverRating || 0); }, 0) / FB_RATINGS.length;
  var avgMerchant = FB_RATINGS.reduce(function(s, r){ return s + (r.merchantRating || 0); }, 0) / FB_RATINGS.length;
  var html = '<div class="kt-anim-1"><div class="k-stats">';

  html += '</div></div>';
  html += '<div class="k-card kt-anim-2">';
  html += '<div class="k-card-head"><h3><i data-lucide="star"></i> كل التقييمات</h3></div>';
  html += FB_RATINGS.slice(0, 50).map(function(r){
    var stars = function(n){ return '⭐'.repeat(n) + '☆'.repeat(5-n); };
    var merchantName = (FB_MERCHANTS.find(function(m){ return m._fbId === r.merchantId; }) || {}).name || '—';
    var driverName = (FB_DRIVERS.find(function(d){ return d._fbId === r.driverId; }) || {}).name || '—';
    return '<div class="k-rating-card">' +
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px">' +
        '<div><div style="font-size:13px;color:var(--ink-3);margin-bottom:4px">🛵 المندوب</div><div class="k-rating-stars">' + stars(r.driverRating || 0) + '</div></div>' +
        '<div><div style="font-size:13px;color:var(--ink-3);margin-bottom:4px">🏪 المتجر</div><div class="k-rating-stars">' + stars(r.merchantRating || 0) + '</div></div>' +
      '</div>' +
      (r.comment ? '<div class="k-rating-comment">"' + esc(r.comment) + '"</div>' : '') +
      '<div class="k-rating-meta">' +
        '<span>📦 <b>' + esc(r.orderId) + '</b></span>' +
        '<span>🛵 <b>' + esc(driverName) + '</b></span>' +
        '<span>🏪 <b>' + esc(merchantName) + '</b></span>' +
        '<span>🕒 ' + (r.createdAt ? new Date(r.createdAt).toLocaleString('ar-EG') : '—') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
  html += '</div>';
  el.innerHTML = html;
  refreshIcons();
}

/* ═══ ANALYTICS ═══ */
function renderAnalytics(el){
  var days = [];
  var today = new Date(); today.setHours(0,0,0,0);
  for (var i = 6; i >= 0; i--){
    var d = new Date(today); d.setDate(d.getDate() - i);
    days.push({ date: d, label: ['ح','ن','ث','ر','خ','ج','س'][d.getDay()], orders: 0, revenue: 0 });
  }
  FB_ORDERS.forEach(function(o){
    if (!o.createdAt) return;
    var d = new Date(o.createdAt); d.setHours(0,0,0,0);
    var idx = days.findIndex(function(x){ return x.date.getTime() === d.getTime(); });
    if (idx >= 0){
      days[idx].orders++;
      if (o.status === 'delivered') days[idx].revenue += o.total || 0;
    }
  });
  var maxOrders = Math.max.apply(null, days.map(function(d){ return d.orders; })) || 1;
  var maxRevenue = Math.max.apply(null, days.map(function(d){ return d.revenue; })) || 1;
  var merchantCounts = {};
  FB_ORDERS.forEach(function(o){ if (o.merchantId){ merchantCounts[o.merchantId] = (merchantCounts[o.merchantId] || 0) + 1; } });
  var topMerchants = Object.keys(merchantCounts).map(function(id){
    var m = FB_MERCHANTS.find(function(x){ return x._fbId === id; });
    return { name: m ? m.name : id, count: merchantCounts[id] };
  }).sort(function(a, b){ return b.count - a.count; }).slice(0, 5);

  var html = '<div class="kt-anim-1"><div class="k-stats">';
  html += '<div class="k-stat"><div class="k-stat-icon"><i data-lucide="package"></i></div><div class="k-stat-label">إجمالي الطلبات</div><div class="k-stat-value">' + FB_ORDERS.length + '</div></div>';
  html += '<div class="k-stat green"><div class="k-stat-icon"><i data-lucide="check-circle-2"></i></div><div class="k-stat-label">مكتملة</div><div class="k-stat-value">' + FB_ORDERS.filter(function(o){ return o.status === 'delivered'; }).length + '</div></div>';
  html += '<div class="k-stat warn"><div class="k-stat-icon"><i data-lucide="loader"></i></div><div class="k-stat-label">قيد التنفيذ</div><div class="k-stat-value">' + FB_ORDERS.filter(function(o){ return ['confirmed','preparing','out'].indexOf(o.status) !== -1; }).length + '</div></div>';
  html += '<div class="k-stat gold"><div class="k-stat-icon"><i data-lucide="wallet"></i></div><div class="k-stat-label">الإيرادات</div><div class="k-stat-value">' + FB_ORDERS.filter(function(o){ return o.status === 'delivered'; }).reduce(function(s,o){ return s + (o.total || 0); }, 0) + '</div></div>';
  html += '</div></div>';
  html += '<div class="k-card kt-anim-2">';
  html += '<div class="k-card-head"><h3><i data-lucide="bar-chart-3"></i> الطلبات — آخر 7 أيام</h3></div>';
  html += '<div class="kt-chart"><div class="kt-chart-bars">';
  days.forEach(function(d){
    var h = d.orders > 0 ? Math.max(8, (d.orders / maxOrders) * 100) : 3;
    html += '<div class="kt-chart-bar"><div class="count">' + d.orders + '</div><div class="bar" style="height:' + h + '%"></div><div class="label">' + d.label + '</div></div>';
  });
  html += '</div></div></div>';
  html += '<div class="k-card kt-anim-3">';
  html += '<div class="k-card-head"><h3><i data-lucide="trending-up"></i> الإيرادات — آخر 7 أيام</h3></div>';
  html += '<div class="kt-chart"><div class="kt-chart-bars">';
  days.forEach(function(d){
    var h = d.revenue > 0 ? Math.max(8, (d.revenue / maxRevenue) * 100) : 3;
    html += '<div class="kt-chart-bar"><div class="count">' + (d.revenue > 0 ? d.revenue : '') + '</div><div class="bar green" style="height:' + h + '%"></div><div class="label">' + d.label + '</div></div>';
  });
  html += '</div></div></div>';
  if (topMerchants.length){
    html += '<div class="k-card kt-anim-4">';
    html += '<div class="k-card-head"><h3><i data-lucide="trophy"></i> أفضل التجار</h3></div>';
    topMerchants.forEach(function(m, i){
      html += '<div style="display:flex;justify-content:space-between;padding:14px;background:var(--bg-3);border-radius:12px;margin-bottom:8px"><div><b>#' + (i+1) + '</b> ' + esc(m.name) + '</div><div><span class="k-pill k-pill-fresh">' + m.count + ' طلب</span></div></div>';
    });
    html += '</div>';
  }
  el.innerHTML = html;
  refreshIcons();
}

function ktToggleSound(){
  if (!window.KT_SOUND) return;
  var enabled = !KT_SOUND.isEnabled();
  if (enabled){ KT_SOUND.enable(); LS_set('sound_enabled', true); }
  else { KT_SOUND.disable(); LS_set('sound_enabled', false); }
  var btn = $('#soundToggleBtn');
  if (btn){ btn.textContent = enabled ? '✅ مفعّل' : '❌ موقوف'; btn.className = 'k-btn k-btn-sm ' + (enabled ? 'k-btn-success' : 'k-btn-glass'); }
  toast(enabled ? '🔊 الصوت مفعّل' : '🔇 الصوت موقوف', 'success');
}
function ktSetSoundVolume(val){
  var v = parseInt(val) / 100;
  if (window.KT_SOUND) KT_SOUND.setVolume(v);
  LS_set('sound_volume', v);
  var d = $('#volDisplay');
  if (d) d.textContent = Math.round(v * 100) + '%';
}

/* ═══ MODAL / THEME ═══ */
function openModal(html){
  _modalMaps.forEach(function(m){ try { m.remove(); } catch(e){} });
  _modalMaps = [];
  $('#modalContent').innerHTML = html;
  $('#modalBd').classList.add('open');
  document.body.style.overflow = 'hidden';
  refreshIcons();
}
function closeModal(){
  _modalMaps.forEach(function(m){ try { m.remove(); } catch(e){} });
  _modalMaps = [];
  $('#modalBd').classList.remove('open');
  document.body.style.overflow = '';
}

var currentTheme = LS_get('theme', 'dark');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  currentTheme = t; LS_set('theme', t);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#02060f' : '#f7f8fb');
}
function toggleTheme(){ applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); toast(currentTheme === 'dark' ? '🟠 داكن' : '⚪ فاتح', 'success'); }
applyTheme(currentTheme);
function refresh(){ toast('🔄 تحديث...'); switchTab(currentTab); }

/* ═══ INIT ═══ */
document.addEventListener('DOMContentLoaded', function(){
  refreshIcons();
  setTimeout(refreshIcons, 500);
  setTimeout(refreshIcons, 1500);

  if (window.KT_SOUND){
    var soundEnabled = LS_get('sound_enabled', true);
    var soundVolume = LS_get('sound_volume', 0.35);
    if (!soundEnabled) KT_SOUND.disable();
    KT_SOUND.setVolume(soundVolume);
  }

  var savedUid = sessionStorage.getItem('kanteen:admin_uid');
  if (savedUid){
    ktWaitFirebase(function(init){
      init.auth.onAuthStateChanged(function(user){
        if (user && user.uid === savedUid){
          init.db.collection('admins').doc(user.uid).get().then(function(doc){
            if (doc.exists){ ADMIN_UID = user.uid; ADMIN_EMAIL = user.email; startDashboard(); }
            else { sessionStorage.removeItem('kanteen:admin_uid'); }
          });
        }
      });
    });
  } else {
    var inp = $('#inpEmail'); if (inp) inp.focus();
  }

  var em = $('#inpEmail'); if (em) em.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var p = $('#inpPass'); if(p) p.focus(); } });
  var pw = $('#inpPass'); if (pw) pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  $('#modalBd').addEventListener('click', function(e){ if (e.target.id === 'modalBd') closeModal(); });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      closeModal();
      ktCloseLightbox();
    }
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(e){}); });
  }

  console.log('%c🎛️ Admin Panel v10.0 — Advanced Modals','background:linear-gradient(135deg,#ff6b35,#ffb800);color:#fff;padding:6px 14px;border-radius:6px;font-weight:800;font-size:13px');
});
